# ALLOWLIST mode (default): every standard attribute NOT listed here is removed, at every depth.
#
# - `keep`: attributes allowed wherever they occur (top level or inside an allowed sequence).
# - `keep_sequences`: sequences that may stay; their items are filtered with the same lists.
#   A sequence not listed is removed with everything inside it.
# - Value rules still apply to kept attributes: DT -> year, UIDs -> remapped (2.25 HMAC), PN/DA/TM/AE
#   never kept (none is listed; the engine refuses to keep those VRs even if added by mistake, except
#   PatientName which is overwritten with the pseudonym).
# - Kept free text (descriptions, protocol names, code meanings, private blobs) is still byte-checked
#   against the study's original identifiers and scanned for national-ID numbers.
# - Private tags: governed by vendor_private.yaml (also an allowlist).
#
# Changing this list: add a synthetic case + run tests/test_conversion.py (dcm2niix before/after).

keep:
  identity_and_deid:            # values written by the engine
    - PatientName               # := pseudonym
    - PatientID                 # := pseudonym
    - PatientSex
    - PatientIdentityRemoved
    - DeidentificationMethod
    - LongitudinalTemporalInformationModified
    - ClinicalTrialTimePointID  # visit label (e.g. T0..T3); the free-text description is dropped
