# Vendor private-tag policy for breast MRI de-identification (ALLOWLIST).
#
# Default: ALL private elements are removed. Only the elements listed under `keep` survive, matched by
# (group, private creator, element byte); the block byte (xx in gggg,xxEE) is assigned per file by the
# creator. The engine keeps the original element numbers, which matters because dcm2niix reads several
# private tags at fixed numbers (e.g. 0043,1039 assumes the creator sits in block 0x10).
#
# Kept values still go through the generic rules (no PN/DA/TM, DT -> year, UIDs remapped; inside kept
# private SEQUENCES the standard allowlist applies too) and through the per-study byte search for
# original identifiers. Compressed/opaque blobs whose content cannot be byte-checked are never kept.
#
# SOURCE: element list taken from dcm2niix source console/nii_dicom.cpp (github.com/rordenlab/dcm2niix,
# commit 8282dbf, 2026-07-24): the private tags dcm2niix reads, restricted to acquisition, diffusion,
# timing, geometry and scaling. Creators confirmed on real data for GE (Signa HDxt and other GE MR in
# a public trial collection), Philips (Achieva, two software generations) and Siemens (VB-era, without
# CSA). Siemens XA/XB creators ('SIEMENS MR SDS 01' / 'SDI 02' / 'SDR 01') confirmed on an original Vida XB10 export.
# Re-check against a newer dcm2niix release when upgrading it.
#
# SOURCES 2 and 3 (entries marked `src:`): published safe-private lists, restricted to MR acquisition
# parameters with numeric or CS values (no free text, no CT/X-ray/presentation tags):
#   - TCIA private tag knowledge base (UAMS Posda, github.com/UAMS-DBMI/PosdaTools,
#     posda/posdatools/migrations/private_tag_kb/data.sql, table pt, consensus disposition K or KB);
#   - DICOM PS3.15 Table E.3.10-1 "Safe Private Attributes" (dicom.nema.org, current edition).
# Cross-check (2026-10-23): TCIA and RSNA CTP mark the Siemens CSA headers X (remove) and several GE
# diffusion fields R (review). They are kept here because dcm2niix needs them: the CSA series header
# and the XA protocol only after the ASCCONV scrubber, everything byte-checked. CTP's bundled
# PrivateTagDictionary.xml ("keep safe private elements") has no Siemens/Philips MR entries coded K,
# so that switch alone would lose b-values and Philips scaling: the CTP target uses THIS list instead.
# Creator strings are matched case-insensitively here; the CTP script lists the spelling variants
# (CTP compares creators exactly).

siemens:
  keep:
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x0A, name: NumberOfImagesInMosaic, why: mosaic unpacking}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x0B, name: SliceMeasurementDuration, why: timing}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x0C, name: B_value, why: DWI b-value}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x0D, name: DiffusionDirectionality, why: DWI}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x0E, name: DiffusionGradientDirection, why: DWI bvec}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x14, name: ImaRelTablePosition, why: table position}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x18, name: DwellTime, why: readout timing}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x27, name: B_matrix, why: DWI}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x28, name: BandwidthPerPixelPhaseEncode, why: distortion correction}
    - {group: 0x0019, creator: "SIEMENS MR HEADER", element: 0x29, name: MosaicRefAcqTimes, why: slice timing}
    - {group: 0x0029, creator: "SIEMENS CSA HEADER", element: 0x08, name: CSAImageHeaderType, why: CSA parsing}
    - {group: 0x0029, creator: "SIEMENS CSA HEADER", element: 0x09, name: CSAImageHeaderVersion, why: CSA parsing}
    - {group: 0x0029, creator: "SIEMENS CSA HEADER", element: 0x10, name: CSAImageHeaderInfo, why: "b-value, bvec, slice times, phase-encode polarity"}
    - {group: 0x0029, creator: "SIEMENS CSA HEADER", element: 0x18, name: CSASeriesHeaderType, why: CSA parsing}
    - {group: 0x0029, creator: "SIEMENS CSA HEADER", element: 0x19, name: CSASeriesHeaderVersion, why: CSA parsing}
    - {group: 0x0029, creator: "SIEMENS CSA HEADER", element: 0x20, name: CSASeriesHeaderInfo, scrub: siemens_csa_series, why: "rebuilt with only MrPhoenixProtocol, ASCCONV allowlist-filtered (scrub.py)"}
    - {group: 0x0051, creator: "SIEMENS MR HEADER", element: 0x0B, name: AcquisitionMatrixText, why: matrix}
    - {group: 0x0051, creator: "SIEMENS MR HEADER", element: 0x0E, name: ImageOrientationText, why: geometry}
    - {group: 0x0051, creator: "SIEMENS MR HEADER", element: 0x0F, name: CoilString, why: coil info}
    - {group: 0x0051, creator: "SIEMENS MR HEADER", element: 0x11, name: ImaPATModeText, why: "acceleration factor (without it dcm2niix falls back to a wrong ParallelReductionFactorInPlane on XA/XB)"}
    - {group: 0x0051, creator: "SIEMENS MR HEADER", element: 0x13, name: PositivePCSDirections, why: geometry}
    # Siemens XA (enhanced / MFSPLIT) - creators to be confirmed on XA data
    - {group: 0x0021, creator: "SIEMENS MR SDS 01", element: 0x05, name: RelTablePosition, why: table position}
    - {group: 0x0021, creator: "SIEMENS MR SDS 01", element: 0x09, name: PATModeText, why: parallel imaging}
    - {group: 0x0021, creator: "SIEMENS MR SDS 01", element: 0x5A, name: ScanningSequenceSiemens, why: sequence type}
    - {group: 0x0021, creator: "SIEMENS MR SDS 01", element: 0x5B, name: SequenceVariantSiemens, why: sequence type}
    - {group: 0x0021, creator: "SIEMENS MR SDS 01", element: 0x5C, name: ScanOptionsSiemens, why: sequence type}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x04, name: TimeAfterStart, why: timing}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x06, name: ICE_dims, why: volume assembly}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x1C, name: PhaseEncodingDirectionPositive, why: PE polarity}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x42, name: RealDwellTime, why: readout timing}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x4F, name: CoilElements, why: coil info}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x53, name: BandwidthPerPixelPhaseEncode21, why: distortion correction}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x58, name: AcquisitionMatrixText21, why: matrix}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x75, name: ImageTypeText, why: image type}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x76, name: DeepLearningText, why: reconstruction}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0xFE, name: XAPerFrameSequence, why: "Enhanced MR per-frame private container (slice times, bandwidth, ICE dims); only listed elements survive inside"}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x8A, name: FrameNumberInSeries, why: volume assembly}
    - {group: 0x0021, creator: "SIEMENS MR SDI 02", element: 0x8E, name: ICE_dimsLong, why: volume assembly}
    - {group: 0x0021, creator: "SIEMENS MR SDS 01", element: 0x19, name: CSASeriesHeaderInfoXA, scrub: siemens_ascconv, why: "XA/XB protocol: raw blob holds serial, exam date, original UIDs -> only the ASCCONV block, allowlist-filtered (scrub.py), is kept"}
    - {group: 0x0021, creator: "SIEMENS MR SDS 01", element: 0xFE, name: XAEnhancedProtocolSequence, why: "Enhanced MR: private sequence (in SharedFunctionalGroupsSequence) holding the scrubbed protocol"}
  notes:
    - "XA/XB (Vida, Terra.X) and VB-VE CSA series header: the raw protocol carries the device serial, the exam date (tReferenceImageN UIDs) and free text; kept only after the ASCCONV allowlist scrubber (scrub.py), then byte-checked."
    - "If CSA headers were stripped upstream, SequenceName (e.g. '*re_b800t', '*ep_b50_1000') still encodes the b-value per file."
    - "Original Siemens instance/frame-of-reference UIDs (root 1.3.12.2.1107.5.2...) embed the device serial number and a timestamp: always remap."

