[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-cloak"
version = "1.0.0"
description = "DICOM Cloak (MAGIC Lab): de-identification of breast MRI DICOM (Siemens, Philips, GE) for research, with vendor private-tag allowlists, DCE timing and leak verification"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Andrzej Liebert", email = "andrzej.liebert@ipipan.waw.pl"}]
dependencies = ["pydicom==3.0.2", "numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "nibabel>=5", "dcm2niix>=1.0.20240202"]  # dcm2niix: before/after conversion regression

[project.scripts]
dicom-cloak = "dicom_cloak.cli:main"
dicom-cloak-check = "dicom_cloak.check:main"
dicom-cloak-report = "dicom_cloak.report:main"
dicom-cloak-compare = "dicom_cloak.compare:main"
dicom-cloak-ctp = "dicom_cloak.ctp:main"

[tool.setuptools.packages.find]
where = ["src"]
